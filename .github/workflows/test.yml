name: Test

on:
  push:
    branches:
      - dev-backend
  pull_request:
    branches:
      - dev-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: ./mvnw clean test
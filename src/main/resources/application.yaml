spring:
  application:
    name: learnhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql:5432/learnhub}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

api:
  security:
    token:
      secret: ${JWT_SECRET:secret-key}

currency:
  frankfurter:
    url: ${FRANKFURTER_URL:https://api.frankfurter.dev}